# Publishes site/ to GitHub Pages, https://openanimalnutrition.org/, on every push to main, so a
# merged pull request is live within minutes. Nothing is built here: the homepage is written by
# hand, and site/fhir is written only by release.yml.
#
# Written 26 Oct 2026. Needs, once: Settings > Pages > Source "GitHub Actions", and the custom
# domain openanimalnutrition.org.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
